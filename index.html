        // ------------------------------------------------------------
        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildQuestionSet() {
            const perAxis = 4;
            let selected = [];

            Object.values(questionPool).forEach(axis => {
                const shuffledTexts = shuffleArray(axis.questions);
                const picked = shuffledTexts.slice(0, perAxis).map(text => ({
                    text: text,
                    aKey: axis.aKey,
                    bKey: axis.bKey
                }));
                selected = selected.concat(picked);
            });

            return shuffleArray(selected);
        }

            }
            if (allExtreme) {
                return { title: "振り切れた二面性の持ち主", desc: "中間を一切選ばず、極端から極端へ跳び続けた稀有な存在。" };
            }
            return null;
        }

        let currentIdx = 0;
        let answers = [];

        function handleAnswer(value) {
            answers.push({ q: questions[currentIdx], value: value });
            currentIdx++;
            updateUI();
        }

        function updateUI() {
            const progress = (currentIdx / questions.length) * 100;
            document.getElementById("progressBar").style.width = progress + "%";

            const qText = document.getElementById("qText");
            if (currentIdx < questions.length) {
                qText.classList.remove("animate-reveal");
                void qText.offsetWidth; 
                qText.classList.add("animate-reveal");
                
                qText.textContent = questions[currentIdx].text;
                document.getElementById("qNum").textContent = `Analysis: ${String(currentIdx + 1).padStart(2, '0')} / ${questions.length}`;
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quizArea").classList.add("hidden");
            document.getElementById("progressContainer").classList.add("hidden");
            document.getElementById("resultArea").classList.remove("hidden");

            // 各軸のスコアをリセット（同点回避の微小乱数を付与）
            const scores = { 
                C1: Math.random() * 0.01, A1: 0, 
                C2: Math.random() * 0.01, L2: 0, 
                I:  Math.random() * 0.01, O:  0, 
                T:  Math.random() * 0.01, F:  0 
            };

            answers.forEach(ans => {
                const weight = ans.value - 3; 
                if (weight < 0) {
                    scores[ans.q.aKey] += Math.abs(weight);
                } else if (weight > 0) {
                    scores[ans.q.bKey] += weight;
                }
            });

            // 最終タイプの判定
            const finalType = [
                scores.C1 >= scores.A1 ? "C" : "A",
                scores.C2 >= scores.L2 ? "C" : "L",
                scores.I >= scores.O ? "I" : "O",
                scores.T >= scores.F ? "T" : "F"
            ].join("");

            const data = results[finalType] || results.CCIT;
            
            // 画像の表示（16:9ワイド表示対応 / .jpg固定）
            const imgElement = document.getElementById("resImage");
            const imageFile = typeImageMap[finalType] || "1.jpg";
            imgElement.src = imageFile.replace('.png', '.jpg');

            document.getElementById("resId").textContent = `TYPE: ${finalType}`;
            document.getElementById("resTitle").textContent = data.title;
            document.getElementById("resMain").textContent = data.main;
            document.getElementById("resAdvice").textContent = data.advice;
            document.getElementById("resHenken").innerHTML = data.henken.map(h => `
                <li class="relative ml-6 text-base md:text-lg text-ivory/90 list-item-bullet hover:text-gold-accent transition-colors duration-300">
                    ${h}
                </li>
            `).join("");

            // 相性の良いタイプの表示
            const compat = data.compat;
            if (compat) {
                const compatType = compat.type;
                const compatData = results[compatType] || results.CCIT;
                const compatImageFile = (typeImageMap[compatType] || "1.jpg").replace('.png', '.jpg');
                document.getElementById("compatImage").src = compatImageFile;
                document.getElementById("compatId").textContent = `TYPE: ${compatType}`;
                document.getElementById("compatTitle").textContent = compatData.title;
                document.getElementById("compatReason").textContent = compat.reason;
            }

            // 軸ごとのスコアをゲージで可視化
            const gaugesHtml = axisPairs.map(([aKey, bKey]) => {
                const aScore = scores[aKey];
                const bScore = scores[bKey];
                const total = aScore + bScore;
                const aPct = total > 0 ? Math.round((aScore / total) * 100) : 50;
                const bPct = 100 - aPct;
                return `
                    <div class="gauge-row">
                        <div class="gauge-labels">
                            <span class="${aPct >= bPct ? 'text-gold-accent font-bold' : ''}">${axisLabels[aKey]} ${aPct}%</span>
                            <span class="${bPct > aPct ? 'text-gold-accent font-bold' : ''}">${axisLabels[bKey]} ${bPct}%</span>
                        </div>
                        <div class="gauge-track">
                            <div class="gauge-fill" style="width: ${aPct}%"></div>
                        </div>
                    </div>
                `;
            }).join("");
            document.getElementById("axisGauges").innerHTML = gaugesHtml;

            // レアタイプ（極端回答）の演出
            const legendary = getLegendaryTitle(answers);
            const badgeEl = document.getElementById("legendaryBadge");
            const resultMain = document.getElementById("resultArea");
            if (legendary) {
                document.getElementById("legendaryText").textContent = `称号：${legendary.title}`;
                badgeEl.classList.remove("hidden");
                badgeEl.classList.add("flex");
                resultMain.classList.add("legendary-frame");
            } else {
                badgeEl.classList.add("hidden");
                badgeEl.classList.remove("flex");
                resultMain.classList.remove("legendary-frame");
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        updateUI();
    </script>
</body>
</html>
